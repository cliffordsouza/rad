display_information:
  name: Rad
  description: Radix's social HR sidekick - celebrations & answers
  background_color: "#065DFF"
features:
  bot_user:
    display_name: Rad
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      # Post to channels and DM people
      - chat:write
      - chat:write.customize
      # Resolve #social / #rad-test (public + private)
      - channels:read
      - groups:read
      # Resolve people by email (people sheet -> Slack user id)
      - users:read
      - users:read.email
      # Open + read DMs (so Rad can receive and answer questions)
      - im:write
      - im:history
      # Hear @mentions in channels
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
# Q&A runs over Socket Mode (no public URL needed) via the worker
# (npm run worker). The Slack AI Assistant pane is a later polish layer on top.
