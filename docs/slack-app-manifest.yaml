display_information:
  name: Rad
  description: Radix's social HR sidekick - celebrations & answers
  background_color: "#065DFF"
features:
  bot_user:
    display_name: Rad
    always_online: true
oauth_config:
  scopes:
    bot:
      # Post to #social and DM people
      - chat:write
      - chat:write.customize
      # Read channel lists (resolve #social) - public + private
      - channels:read
      - groups:read
      # Resolve people by email (people sheet -> Slack user id) for DMs + tags
      - users:read
      - users:read.email
      # Open DM conversations
      - im:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
# NOTE: Q&A surface = Slack "Agents & AI Apps" assistant pane (chosen).
# It answers briefly from Rad's stored knowledge (Confluence + Drive + people
# data). Added at Phase 4 - needs assistant:write + assistant/message events
# pointed at Rad's deployed URL, so it is intentionally NOT in this Phase-2
# manifest (those event settings require the live endpoint to exist first).
